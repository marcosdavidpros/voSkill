[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voskill"
version = "0.1.0"
description = "API de planejamento de competências e demandas de equipe"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "oracledb>=2.5,<4",
    "pymoo>=0.6.1.5,<0.7",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"